<html>
    <head>
        <title>Student Registry</title>
    </head>
    <body>
        <h1>Enter Student Details for creation</h1>
        <form action="/create" method="post">
            <label>Student RollNO: </label>
            <input type="text" name="roll">
            <br><br>

            <label>Student Name: </label>
            <input type="text" name="name">
            <br><br>

            <label>Student Semester: </label>
            <input type="text" name="sem">
            <br><br>

            <label>Student CGPA: </label>
            <input type="text" name="cgpa">

            <button type="submit">Create Record</button>
        </form>

        <div id="res"></div>
        <br>

    </body>
</html>
